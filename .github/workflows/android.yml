# Builds the Android APK in GitHub's cloud and publishes it as a release download.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: tar -xzf *.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build web app
        working-directory: anatomy-app
        run: |
          npm ci
          npm run build

      - name: Create Android project
        working-directory: anatomy-app
        run: |
          npm install @capacitor/core@6.2.0 @capacitor/android@6.2.0 @capacitor/cli@6.2.0
          echo '{"appId":"com.anatomy3d.app","appName":"אנטומיה 3D","webDir":"dist","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      # Keep one signing key across builds, so a new APK installs as an update over the old one.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: anatomy3d-signing-key-v1

      - name: Create signing key (first build only)
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Anatomy 3D,O=Anatomy 3D,C=IL"
          fi

      - name: Build APK
        working-directory: anatomy-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp anatomy-app/android/app/build/outputs/apk/debug/app-debug.apk anatomy3d.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anatomy3d-apk
          path: anatomy3d.apk

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest anatomy3d.apk --title "אנטומיה 3D – קובץ התקנה" --notes "להורדה: לחצו על anatomy3d.apk והתקינו בטלפון אנדרואיד."
